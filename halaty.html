<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Халати - LOVELY VS STORE</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #ffd6e0;
            color: #c71585;
        }
        header {
            background: #ffd6e0;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #ffb6c1;
        }
        header h1 { margin: 0; font-size: 24px; }
        nav {
            background: #ffd6e0;
            padding: 10px;
            float: left;
            width: 150px;
            border-right: 1px solid #ffb6c1;
            min-height: 400px;
        }
        nav a {
            display: block;
            color: #c71585;
            text-decoration: none;
            font-weight: bold;
            padding: 7px 5px;
            font-size: 15px;
            border-bottom: 1px solid #ffb6c1;
        }
        nav a:hover { text-decoration: underline; }
        nav a:last-child { border-bottom: none; }

        .catalog {
            margin-left: 150px;
            padding: 20px;
        }
        .catalog h2 {
            color: #c71585;
            font-size: 24px;
            border-bottom: 2px solid #ffb6c1;
            padding-bottom: 8px;
        }

        /* ТОВАРЫ СЛЕВА */
        .tovary {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding: 15px 0;
            justify-content: flex-start;
        }
        .tovar {
            background: #fff0f5;
            border-radius: 12px;
            padding: 10px;
            width: 160px;
            text-align: center;
            border: 1px solid #ffb6c1;
            transition: 0.3s;
        }
        .tovar:hover { transform: scale(1.05); }
        .tovar img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }
        .tovar h3 { color: #c71585; margin: 8px 0 4px; font-size: 14px; }
        .tovar p { margin: 4px 0; color: #a01060; font-size: 13px; }
        .tovar a {
            display: inline-block;
            background: #c71585;
            color: white;
            padding: 6px 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 8px;
            font-size: 12px;
        }
        .tovar a:hover { background: #a01060; }

        footer {
            background: #ffd6e0;
            color: #c71585;
            text-align: center;
            padding: 12px;
            border-top: 1px solid #ffb6c1;
            font-size: 14px;
            clear: both;
            margin-left: 150px;
        }

        @media (max-width: 768px) {
            header h1 { font-size: 20px; }
            nav {
                float: none;
                width: 100%;
                min-height: auto;
                border-right: none;
                border-bottom: 1px solid #ffb6c1;
            }
            nav a { font-size: 14px; padding: 8px 10px; }
            .catalog { margin-left: 0; padding: 10px; }
            .tovar { width: 130px; padding: 8px; }
            .tovar img { height: 150px; }
            .tovar h3 { font-size: 12px; }
            .tovar p { font-size: 11px; }
            .tovar a { font-size: 11px; padding: 5px 10px; }
            footer { margin-left: 0; font-size: 12px; }
        }
    </style>
</head>

    </nav>

<div class="tovar">

            <div class="tovar">
